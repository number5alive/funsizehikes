- comment: This is unreal! I have hiked though the limestone a few times(even did
    a sweet loop with packrafts down through the blue rivers), but this just makes
    me want to hike down to Kakwa now! The section where you were between Weaver and
    limestone is what we call Death Valley. I have been through there too many times
    to count now but it never gets old. Unreal adventure!
